[project]
name = "edge-predictions-backend"
version = "0.1.0"
description = "Kalshi + Apify trading bot backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "cryptography>=43.0",
    "apify-client>=1.8",
    "sqlalchemy>=2.0",
    "apscheduler>=3.10",
    "pydantic-settings>=2.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
